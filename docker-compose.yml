version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: soc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soc_password}
      POSTGRES_DB: ${POSTGRES_DB:-soc_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soc_user} -d ${POSTGRES_DB:-soc_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: soc/backend/Dockerfile
    container_name: soc_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-soc_user}:${POSTGRES_PASSWORD:-soc_password}@db:5432/${POSTGRES_DB:-soc_db}
      - ENVIRONMENT=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_TOKEN=${API_TOKEN:-soc-secret-token-change-in-production}
      - AUTOMATION_MODE=${AUTOMATION_MODE:-recommend_only}
      - CONFIG_DIR=/app/soc/config
      - MODEL_DIR=/app/ids_project
      - SOC_EXECUTOR=${SOC_EXECUTOR:-simulated}
      - SOC_LAB_MODE=${SOC_LAB_MODE:-false}
    ports:
      - "8000:8000"
    volumes:
      - ./soc/config:/app/soc/config:ro
      - ./ids_project:/app/ids_project:ro

  dashboard:
    build:
      context: ./soc/dashboard
      dockerfile: Dockerfile
    container_name: soc_dashboard
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  postgres_data:
