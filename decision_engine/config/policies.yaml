# Decision Engine Policies
# Policies are evaluated by the Policy Engine in order of priority (100 -> 1)
# Higher priority policies win in conflict resolution.

policies:
  - policy_id: "DOS-SYN-001"
    name: "High-Confidence SYN Flood Autonomous Containment"
    description: "Instantly contain high-intensity DoS SYN flood attacks against monitored assets."
    enabled: true
    priority: 100
    conditions:
      attack_type:
        - "DoS SYN Flood"
        - "SYN_FLOOD"
      confidence:
        minimum: 0.85
      risk:
        minimum: 70.0
    decision: "CONTAIN"
    severity: "CRITICAL"
    automation_level: 5
    playbook_id: "PB-DOS-SYN"
    cooldown_seconds: 300
    notification_required: true

  - policy_id: "DOS-UDP-001"
    name: "UDP Flood Autonomous Rate-Limiting & Mitigation"
    description: "Mitigate high-volume UDP flood attacks with temporary firewall blocks and rate limiting."
    enabled: true
    priority: 90
    conditions:
      attack_type:
        - "DoS UDP Flood"
        - "UDP_FLOOD"
      confidence:
        minimum: 0.85
      risk:
        minimum: 65.0
    decision: "CONTAIN"
    severity: "CRITICAL"
    automation_level: 5
    playbook_id: "PB-DOS-UDP"
    cooldown_seconds: 300
    notification_required: true

  - policy_id: "DOS-DNS-001"
    name: "DNS Flood Mitigation Policy"
    description: "Contain DNS amplification and query floods."
    enabled: true
    priority: 85
    conditions:
      attack_type:
        - "DoS DNS Flood"
        - "DNS_FLOOD"
      confidence:
        minimum: 0.80
      risk:
        minimum: 60.0
    decision: "CONTAIN"
    severity: "HIGH"
    automation_level: 5
    playbook_id: "PB-DOS-DNS"
    cooldown_seconds: 300
    notification_required: true

  - policy_id: "DOS-ICMP-001"
    name: "ICMP Ping Flood Filter Policy"
    description: "Filter excessive ICMP traffic directed at network hosts."
    enabled: true
    priority: 80
    conditions:
      attack_type:
        - "DoS ICMP Flood"
        - "ICMP_FLOOD"
      confidence:
        minimum: 0.80
      risk:
        minimum: 55.0
    decision: "CONTAIN"
    severity: "HIGH"
    automation_level: 4
    playbook_id: "PB-DOS-ICMP"
    cooldown_seconds: 300
    notification_required: true

  - policy_id: "BRUTE-FORCE-001"
    name: "Credential Brute Force Protection Policy"
    description: "Mitigate authentication brute force attempts with IP quarantine and credential resets."
    enabled: true
    priority: 75
    conditions:
      attack_type:
        - "Dictionary Brute Force"
        - "BRUTE_FORCE"
      confidence:
        minimum: 0.75
      risk:
        minimum: 45.0
    decision: "CONTAIN"
    severity: "HIGH"
    automation_level: 4
    playbook_id: "PB-BRUTE-FORCE"
    cooldown_seconds: 600
    notification_required: true

  - policy_id: "MITM-ARP-001"
    name: "ARP Spoofing & Poisoning Autonomous Mitigation Policy"
    description: "Detect and mitigate Man-in-the-Middle ARP poisoning attacks via port quarantine."
    enabled: true
    priority: 70
    conditions:
      attack_type:
        - "MITM ARP Spoofing"
        - "ARP_SPOOFING"
      confidence:
        minimum: 0.70
      risk:
        minimum: 50.0
    decision: "CONTAIN"
    severity: "HIGH"
    automation_level: 4
    playbook_id: "PB-MITM-ARP"
    cooldown_seconds: 300
    notification_required: true

  - policy_id: "RECON-OS-001"
    name: "OS Fingerprinting & Advanced Reconnaissance Policy"
    description: "Detect OS fingerprinting scans and initiate defensive monitoring."
    enabled: true
    priority: 55
    conditions:
      attack_type:
        - "Recon OS Scan"
      confidence:
        minimum: 0.60
      risk:
        minimum: 30.0
    decision: "MONITOR"
    severity: "MEDIUM"
    automation_level: 2
    playbook_id: "PB-RECON-OS"
    cooldown_seconds: 180
    notification_required: true

  - policy_id: "RECON-PING-001"
    name: "ICMP Sweep & Network Mapping Containment Policy"
    description: "Detect ping sweeps and apply rate-limiting to map attempts."
    enabled: true
    priority: 50
    conditions:
      attack_type:
        - "Recon Ping Sweep"
      confidence:
        minimum: 0.60
      risk:
        minimum: 25.0
    decision: "CONTAIN"
    severity: "MEDIUM"
    automation_level: 3
    playbook_id: "PB-RECON-PING"
    cooldown_seconds: 180
    notification_required: true

  - policy_id: "RECON-HOST-001"
    name: "Host Discovery Sweep Detection Policy"
    description: "Track host discovery activity across subnets."
    enabled: true
    priority: 45
    conditions:
      attack_type:
        - "Recon Host Discovery"
        - "Reconnaissance"
        - "Port Scan"
      confidence:
        minimum: 0.0
      risk:
        minimum: 15.0
    decision: "MONITOR"
    severity: "LOW"
    automation_level: 2
    playbook_id: "PB-RECON-HOST"
    cooldown_seconds: 120
    notification_required: true

  - policy_id: "BENIGN-001"
    name: "Benign Network Traffic Baseline Policy"
    description: "Log and observe benign network traffic without remediation action."
    enabled: true
    priority: 25
    conditions:
      attack_type:
        - "Benign Traffic"
        - "Benign"
      confidence:
        minimum: 0.0
      risk:
        minimum: 0.0
    decision: "ALLOW"
    severity: "INFORMATIONAL"
    automation_level: 0
    playbook_id: "PB-BENIGN"
    cooldown_seconds: 0
    notification_required: false

  - policy_id: "DEFAULT-FALLBACK"
    name: "Default Fallback Policy"
    description: "Safely log and notify security analysts when no specific policy matches."
    enabled: true
    priority: 10
    conditions: {}
    decision: "NOTIFY"
    severity: "LOW"
    automation_level: 1
    playbook_id: "PB-DEFAULT"
    cooldown_seconds: 60
    notification_required: true
