policy_id: POL-ID-001-BF
name: Dictionary Brute Force Mitigation Policy
enabled: true
description: Auto-mitigate or alert on SSH/auth dictionary brute force attacks.

conditions:
  attack_type: Dictionary Brute Force
  min_confidence: 0.80
  min_risk: 45.0

decision:
  severity: HIGH
  priority: P2
  automation_level: 4
  analyst_required: true

playbook:
  id: PB-ID-001-BRUTEFORCE

actions:
  - BLOCK_SOURCE_IP
  - RESET_CREDENTIALS
  - NOTIFY_SOC
  - CREATE_INCIDENT
